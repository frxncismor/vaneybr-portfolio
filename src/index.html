  <body class="kedebideri-regular text-base font-normal">
    <script>
      // Initialize theme before Angular loads to prevent flash
      // Always use system preference
      (function () {
        const darkClass = 'dark';

        function getSystemPreference() {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
          const htmlElement = document.documentElement;
          if (theme === 'dark') {
            htmlElement.classList.add(darkClass);
          } else {
            htmlElement.classList.remove(darkClass);
          }
        }

        const theme = getSystemPreference();
        applyTheme(theme);
      })();
    </script>
