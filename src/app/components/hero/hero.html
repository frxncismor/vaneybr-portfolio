<div
  class="w-11/12 max-w-3xl text-center mx-auto h-screen flex flex-col items-center justify-center gap-4"
>
  <img src="./myphoto.jpeg" class="rounded-md h-32 mt-28" />
  <h3 class="flex items-end gap-2 text-xml md:text-2xl mb-3 font-Ovo">
    {{ 'home.hero.welcome' | translate: { name: "Vanessa Yebra" } }}<img src="./hand-icon.png" class="w-6" />
  </h3>
  <h1 class="text-3xl sm:text-6xl lg:text-[66px] font-Ovo">{{ 'home.hero.jobTitle' | translate: { seniority: "Junior" } }}</h1>
  <p class="max-w-2xl mx-auto font-Ovo">
    {{ 'home.hero.description' | translate }}
  </p>

  <div class="flex flex-col sm:flex-row items-center gap-4 mt-4">
    <a
      href="https://www.linkedin.com/in/vanessayebra/"
      target="_blank"
      class="px-10 py-3 border rounded-full bg-gradient-to-r from-[#b820e6] to-[#da7d20] text-white flex items-center gap-2 dark:border-transparent"
      >{{ 'home.hero.contactMe' | translate }}<img src="./right-arrow-white.png" class="w-4"
    /></a>

    <a
      href="/resume.pdf"
      target="_blank"
      class="px-10 py-3 border rounded-full border-gray-500 flex items-center gap-2 bg-white dark:text-black"
      >{{ 'home.hero.downloadResume' | translate }}<img src="./download-icon.png" class="w-4"
    /></a>
  </div>
</div>
